appId: dev.stama.geniex-studio
productName: GenieX Studio
copyright: Copyright © 2026 stama
directories:
  buildResources: resources
  output: release
files:
  - out/**
  - package.json
  - '!**/*.map'
extraResources:
  - from: sidecar
    to: sidecar
    filter:
      - '**/*'
      - '!.venv/**'
      - '!models/**'
      - '!__pycache__/**'
      - '!**/__pycache__/**'
      - '!tests/**'
  - from: resources/tray.png
    to: tray.png
  - from: resources/tray@2x.png
    to: tray@2x.png
asarUnpack:
  - '**/*.node'
  - node_modules/better-sqlite3/**
  - node_modules/node-pty/**
# No compile toolchain on Windows-on-ARM dev boxes: never node-gyp / @electron/rebuild.
npmRebuild: false
buildDependenciesFromSource: false
nodeGypRebuild: false
win:
  target:
    - target: nsis
      arch:
        - arm64
  icon: resources/icon.png
  # No spaces: GitHub rewrites spaces in uploaded asset names, which would no longer match the URL in latest.yml
  # and every auto-update download would 404.
  artifactName: GenieX-Studio-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: GenieX Studio
  # Keep chats, settings and downloaded models when uninstalling; an update never touches them either.
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  # Adds Studio to Settings → Apps with a working "modify/uninstall" entry.
  menuCategory: false
  uninstallDisplayName: ${productName} ${version}
# The .blockmap emitted next to the installer is what lets electron-updater download only changed blocks.
publish:
  - provider: github
    owner: chargmak
    repo: geniex-studio
    # Uploaded as a draft; publishing the release on GitHub is what makes it visible to installed clients.
    releaseType: draft
